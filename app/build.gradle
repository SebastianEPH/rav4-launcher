apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

// El JS de la interfaz React Native vive en ../rn
react {
    root = file("../rn")
    reactNativeDir = file("../rn/node_modules/react-native")
    codegenDir = file("../rn/node_modules/@react-native/codegen")
    cliFile = file("../rn/node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "pe.radio.rav4"
    defaultConfig {
        applicationId "pe.radio.rav4"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // el CI pasa -PversionCode=… -PversionName=…
        versionCode((project.findProperty("versionCode") ?: "100") as int)
        versionName(project.findProperty("versionName") ?: "1.3-local")
    }
    // misma clave que siempre: la radio instala encima sin desinstalar
    signingConfigs {
        orbita {
            storeFile rootProject.file(System.getenv("KEYSTORE_PATH") ?: "debug.keystore")
            storePassword "android"; keyAlias "diag"; keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.orbita }
        release { signingConfig signingConfigs.orbita; minifyEnabled false }
    }
    // las carpetas de siempre, sin mover nada
    sourceSets {
        main {
            manifest.srcFile "../AndroidManifest.xml"
            java.srcDirs = ["../src"]
            res.srcDirs = ["../res"]
            assets.srcDirs = ["../assets"]
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    def bom = platform("androidx.compose:compose-bom:2025.10.00")
    implementation(bom)
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.activity:activity-compose:1.10.1")
}
