name: Demo en GitHub Pages

# Publica la página (site/) + la interfaz web (assets/web → demo/) + capturas en la rama gh-pages.
on:
  push:
    branches: [main]
    paths:
      - 'assets/web/**'
      - 'site/**'
      - 'docs/img/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # para escribir la rama gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          mkdir -p _site/demo _site/img
          cp -r site/. _site/
          cp -r assets/web/. _site/demo/
          cp docs/img/*.png _site/img/
          touch _site/.nojekyll

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Demo: ${{ github.sha }}"
