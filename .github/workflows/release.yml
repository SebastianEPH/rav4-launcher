name: Release APK

# Cada push a main compila, firma y publica un Release con versión automática.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear el tag, el Release y subir el APK

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.3.${{ github.run_number }}
    steps:
      - name: Clonar repo (historial completo para las notas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Por defecto la acción pide el paquete 'tools', que ya no existe y rompe el paso.
      - name: Instalar Android SDK (build-tools y plataforma)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;34.0.0'

      # Misma clave que la del Mac: así la radio instala la versión nueva encima de la anterior.
      - name: Restaurar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto KEYSTORE_B64; sin él el APK no se podría instalar encima del actual."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > debug.keystore

      # versionCode siempre creciente (si no, Android lo trata como downgrade y no instala encima)
      # y versionName = tag, que es lo que el launcher compara para saber si hay versión nueva.
      - name: Poner la versión en el manifest
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$CODE\"/; s/android:versionName=\"[^\"]+\"/android:versionName=\"${VERSION#v}\"/" AndroidManifest.xml
          grep -o 'android:version[A-Za-z]*="[^"]*"' AndroidManifest.xml

      - name: Compilar APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Renombrar APK con la versión
        id: apk
        run: |
          NAME="RAV4Launcher-${VERSION}.apk"
          cp RAV4Launcher.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME"

      # Las notas automáticas de GitHub solo listan pull requests (aquí no hay): se arman desde git.
      - name: Armar las notas (qué se agregó, qué se quitó, qué trae y qué falta)
        run: |
          chmod +x .github/release-notes.sh
          .github/release-notes.sh "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Publicar Release con el APK y las notas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: RAV4 Launcher ${{ env.VERSION }}
          # primero el launcher (las versiones viejas del actualizador toman el primer .apk), luego la ayudante
          files: |
            ${{ steps.apk.outputs.name }}
            RAV4Volumen.apk
          make_latest: true
          body_path: release-notes.md
